server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # relative Location headers — an absolute redirect would leak the
    # internal port (8080) through the 443 mapping
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;
    gzip_min_length 1024;

    error_page 404 /404.html;

    # the site lives at /sivaguru-ravi — authoritative redirect for /
    location = / {
        return 301 /sivaguru-ravi;
    }

    # container healthcheck / CD smoke target
    location = /healthz {
        include /etc/nginx/security-headers.conf;
        default_type text/plain;
        return 200 "ok";
    }

    # hashed build assets: immutable for a year
    location /_next/static/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # resume must never go stale after a swap (plan §8)
    location = /Sivaguru_Ravi_Resume.pdf {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # everything else: revalidate; covers /, deep-link .html files, 404
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/index.html =404;
    }
}
