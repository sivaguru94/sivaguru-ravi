# Mounted on the VPS only (compose.yml) — terminates TLS with the Cloudflare
# Origin Certificate (Full-strict mode). Not baked into the image so local
# runs and CI never need certs. Cert/key mounted read-only at /etc/nginx/certs.
server {
    listen 8443 ssl;
    http2 on;
    server_name shinigami-rog.cc www.shinigami-rog.cc;

    ssl_certificate /etc/nginx/certs/origin-cert.pem;
    ssl_certificate_key /etc/nginx/certs/origin-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    # relative Location headers — an absolute redirect would leak the
    # internal port (8443) through the 443 mapping
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;
    gzip_min_length 1024;

    error_page 404 /404.html;

    # the site lives at /sivaguru-ravi — authoritative redirect for /
    location = / {
        return 301 /sivaguru-ravi;
    }

    location = /healthz {
        include /etc/nginx/security-headers.conf;
        default_type text/plain;
        return 200 "ok";
    }

    location /_next/static/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /Sivaguru_Ravi_Resume.pdf {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/index.html =404;
    }
}
