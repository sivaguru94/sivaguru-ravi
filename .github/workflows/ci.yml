name: CI

on:
  push:
    branches: [master, next-rewrite]
  pull_request:

permissions:
  contents: read

jobs:
  lint-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # lockfile is written by npm 11 locally; npm 10 (bundled with Node 20)
      # rejects its optional-dep entries — keep CI on the same npm major
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: node scripts/check-budget.mjs

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # lockfile is written by npm 11 locally; npm 10 (bundled with Node 20)
      # rejects its optional-dep entries — keep CI on the same npm major
      - run: npm install -g npm@11
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
